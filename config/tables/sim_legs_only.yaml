# A typical real table: same top as the sim table but only four legs, no skirt — the LiDARs see
# just the legs. Try it in MuJoCo:  ... active_perception_wbc.launch.py table:=sim_legs_only
name: sim_legs_only
frame: odom
center: [2.0, 0.0]
yaw: 0.0
size: [0.8, 0.7]
top_z: 0.8
thickness: 0.04
legs: [[0.36, 0.31, 0.02], [0.36, -0.31, 0.02], [-0.36, 0.31, 0.02], [-0.36, -0.31, 0.02]]
skirt: 0.0
notes: example of an open-leg table
